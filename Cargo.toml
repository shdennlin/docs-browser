[package]
name = "docs-browser"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
description = "Zero-config local browser for project documentation (Markdown, Mermaid, HTML)"
license = "MIT"
keywords = ["markdown", "docs", "preview", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/tests/fixtures", "/.claude", "/target"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive"] }
futures-util = "0.3.34"
notify = "9.0.0"
open = "5.4.5"
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
