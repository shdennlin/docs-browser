<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>docs-browser</title>
  <link rel="stylesheet" href="/style.css">
  <link id="hl-light" rel="stylesheet" href="/vendor/highlight-github.min.css" media="(prefers-color-scheme: light)">
  <link id="hl-dark" rel="stylesheet" href="/vendor/highlight-dracula.css" media="(prefers-color-scheme: dark)">
</head>
<body data-state="loading">
  <div id="app">
    <aside id="sidebar">
      <div id="toolbar">
        <div id="search-row">
          <input id="search" type="search" placeholder="Search file names  ( / )" aria-label="Search" autocomplete="off" spellcheck="false">
          <button id="theme-toggle" type="button" aria-label="Switch between light and dark">&#9788;</button>
          <button id="settings-open" type="button" aria-label="Settings" title="Settings">&#9881;</button>
        </div>
        <div id="mode-row" role="group" aria-label="Search scope">
          <button id="mode-names" type="button" aria-pressed="true">Names</button>
          <button id="mode-contents" type="button" aria-pressed="false">Contents</button>
          <span class="spacer"></span>
          <button id="expand-all" type="button" title="Expand all folders" aria-label="Expand all folders">&#8862;</button>
          <button id="collapse-all" type="button" title="Collapse all folders" aria-label="Collapse all folders">&#8863;</button>
          <button id="wrap-toggle" type="button" aria-pressed="true" title="Wrap long names in the list" aria-label="Wrap long names">&#8629;</button>
        </div>
      </div>
      <div id="tree-banners"></div>
      <div id="side-scroll">
        <nav id="tree" aria-label="Files"></nav>
        <div id="search-results" aria-live="polite" hidden></div>
      </div>
    </aside>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the file list" tabindex="0"></div>
    <main id="main">
      <div id="live-status" class="banner" role="status" hidden></div>
      <div id="banners"></div>
      <div id="preview"></div>
    </main>
    <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div id="settings-card">
        <div id="settings-head"><h2 id="settings-title">Settings</h2><button id="settings-close" type="button" aria-label="Close settings">&times;</button></div>
        <label><input type="checkbox" id="set-wrap"> Wrap long names in the file list</label>
        <label><input type="checkbox" id="set-outline"> Keep the outline open</label>
        <label><input type="checkbox" id="set-wide"> Use the full width for Markdown</label>
        <p class="settings-note">Saved in this browser only. The theme follows the system until you press the sun/moon button; Reset to defaults goes back to the system.</p>
        <button id="settings-reset" type="button">Reset to defaults</button>
      </div>
    </div>
    <div id="top-tools">
      <button id="copy-name" type="button" hidden aria-label="Copy file name" title="Copy file name">&#10064;</button>
  <div id="outline-wrap" hidden>
      <button id="outline-toggle" type="button" aria-label="Outline" aria-pressed="false" title="Outline (click to pin)">&#9776;</button>
      <nav id="outline" aria-label="Outline"></nav>
    </div>
    </div>
  </div>
  <script src="/vendor/markdown-it.umd.min.js"></script>
  <script src="/vendor/markdown-it-task-lists.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/lib.js"></script>
  <script src="/app.js"></script>
</body>
</html>
