<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs-browser</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/vendor/highlight-github.min.css">
</head>
<body data-state="loading">
  <div id="app">
    <aside id="sidebar">
      <div id="tree-banners"></div>
      <nav id="tree" aria-label="Files"></nav>
    </aside>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the file list" tabindex="0"></div>
    <main id="main">
      <div id="live-status" class="banner" role="status" hidden></div>
      <div id="banners"></div>
      <div id="preview"></div>
    </main>
  </div>
  <script src="/vendor/markdown-it.umd.min.js"></script>
  <script src="/vendor/markdown-it-task-lists.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/lib.js"></script>
  <script src="/app.js"></script>
</body>
</html>
